name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-windows-portable
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read versions and verify the tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tauri_version=$(jq -r '.version' app/src-tauri/tauri.conf.json)
          echo "Cargo.toml workspace version: $cargo_version"
          echo "tauri.conf.json version: $tauri_version"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tauri_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and tauri.conf.json ($tauri_version) versions differ"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $REF_NAME does not match the app version $cargo_version (expected tag v$cargo_version)"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The Tauri crate embeds app/dist at compile time (tauri-codegen needs it before cargo).
      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix app
      - name: Build frontend
        shell: bash
        run: npm run build --prefix app
      - name: Test frontend
        shell: bash
        run: npm test --prefix app
      - name: Build release binary
        shell: bash
        run: cargo build -p lingopop-app --release --locked
      - name: Stage portable exe and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "LingoPop-$env:VERSION-windows-x64-portable.exe"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item -Path target/release/lingopop.exe -Destination "dist-release/$name"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "dist-release/$name").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'dist-release/SHA256SUMS.txt'),
            "$hash  $name`n",
            (New-Object System.Text.UTF8Encoding($false)))
          Get-Content dist-release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LingoPop-${{ steps.meta.outputs.version }}-windows-x64-portable
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: publish-prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LingoPop-${{ needs.build.outputs.version }}-windows-x64-portable
          path: dist-release
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # The CHANGELOG section for this version, if there is one.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > section.md
          {
            if grep -q '[^[:space:]]' section.md; then
              cat section.md
            else
              echo "Test pre-release $VERSION of LingoPop for Windows (portable exe)."
            fi
            echo
            echo 'Unsigned test build: Windows SmartScreen may warn (More info -> Run anyway). Requires the Microsoft Edge WebView2 runtime (preinstalled on Windows 10/11). Data folder: %APPDATA%\LingoPop.'
          } > notes.md
          gh release create "$TAG" \
            "dist-release/LingoPop-${VERSION}-windows-x64-portable.exe" \
            dist-release/SHA256SUMS.txt \
            --prerelease --title "LingoPop $VERSION" --notes-file notes.md
