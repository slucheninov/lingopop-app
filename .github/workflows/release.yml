name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every leg checks the versions (and, on a tag run, the tag) with scripts/check-version.py, builds
# its assets, verifies them with scripts/verify-release-assets.py and uploads the artifact
# LingoPop-<version>-<platform> (assets + SHA256SUMS-<platform>.txt). The publish job runs on tag
# pushes only, after EVERY leg succeeded: it assembles the assets selected by
# release-platforms.json, writes and verifies the combined SHA256SUMS.txt, creates a DRAFT
# pre-release with them, checks the uploaded files and only then publishes it. workflow_dispatch
# builds and uploads the artifacts only.
jobs:
  build:
    name: build-windows-portable
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read versions and verify the tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Python on Windows prints CRLF and Git Bash's $() strips only the LF.
          if [ "$REF_TYPE" = "tag" ]; then
            version=$(python scripts/check-version.py --tag "$REF_NAME" | tr -d '\r')
          else
            version=$(python scripts/check-version.py | tr -d '\r')
          fi
          if [ -z "$version" ]; then
            echo "::error::check-version.py printed no version"
            exit 1
          fi
          echo "version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The Tauri crate embeds app/dist at compile time (tauri-codegen needs it before cargo).
      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix app
      - name: Build frontend
        shell: bash
        run: npm run build --prefix app
      - name: Test frontend
        shell: bash
        run: npm test --prefix app
      - name: Build release binary
        shell: bash
        run: cargo build -p lingopop-app --release --locked --features custom-protocol
      - name: Stage portable exe and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "LingoPop-$env:VERSION-windows-x64-portable.exe"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item -Path target/release/lingopop.exe -Destination "dist-release/$name"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "dist-release/$name").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'dist-release/SHA256SUMS-windows-x64.txt'),
            "$hash  $name`n",
            (New-Object System.Text.UTF8Encoding($false)))
          Get-Content dist-release/SHA256SUMS-windows-x64.txt
      - name: Verify the staged assets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python scripts/verify-release-assets.py verify --version "$VERSION" --platforms windows-x64 --manifest SHA256SUMS-windows-x64.txt dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LingoPop-${{ steps.meta.outputs.version }}-windows-x64
          path: dist-release/*
          if-no-files-found: error

  # Native legs on both architectures; the labels are explicit (macos-latest is arm64 and may
  # move). Source: github.com/actions/runner-images README and the GitHub-hosted runners
  # reference, checked 2026-11-05: macos-26 = macOS 26 arm64, macos-26-intel = macOS 26 x64
  # (standard runners).
  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read versions and verify the tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Python on Windows prints CRLF and Git Bash's $() strips only the LF.
          if [ "$REF_TYPE" = "tag" ]; then
            version=$(python scripts/check-version.py --tag "$REF_NAME" | tr -d '\r')
          else
            version=$(python scripts/check-version.py | tr -d '\r')
          fi
          if [ -z "$version" ]; then
            echo "::error::check-version.py printed no version"
            exit 1
          fi
          echo "version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the runner architecture
        shell: bash
        env:
          EXPECTED: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
        run: |
          set -euo pipefail
          actual=$(uname -m)
          echo "runner architecture: $actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::expected a native $EXPECTED runner, got $actual"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix app
      - name: Test frontend
        shell: bash
        run: npm test --prefix app
      # Ad-hoc signing unless ALL six Developer ID secrets are configured; a partial set fails
      # the leg inside the script. The script never prints the values.
      - name: Build, sign, package and verify
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/package-macos.sh --version "$VERSION" --target "$TARGET" --out dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LingoPop-${{ steps.meta.outputs.version }}-macos-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: publish-release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the tag again
        env:
          TAG: ${{ github.ref_name }}
          WINDOWS_VERSION: ${{ needs.build.outputs.version }}
          MACOS_VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          set -euo pipefail
          version=$(python scripts/check-version.py --tag "$TAG" | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::check-version.py printed no version"
            exit 1
          fi
          if [ "$version" != "$WINDOWS_VERSION" ] || [ "$version" != "$MACOS_VERSION" ]; then
            echo "::error::the legs report different versions ($WINDOWS_VERSION, $MACOS_VERSION, expected $version)"
            exit 1
          fi
      # Each artifact lands in its own directory artifacts/LingoPop-<version>-<platform>/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: LingoPop-${{ needs.build.outputs.version }}-*
          path: artifacts
      # The release is created as a DRAFT with every asset, the uploaded files are downloaded
      # again and compared byte for byte with the verified ones, and only then is it published.
      # A failure anywhere leaves at most a draft (never a public release with missing files);
      # delete it by hand before re-running.
      - name: Assemble, verify and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # A version with a SemVer pre-release part (0.3.0-alpha.1) is published as a
          # pre-release; a plain version (0.3.0) becomes the repository's Latest release, which
          # /releases/latest (the in-app update check and the README download links) points to.
          channel=()
          if [[ "$VERSION" == *-* ]]; then channel=(--prerelease); fi
          # Reads release-platforms.json (fails closed), copies the selected assets into
          # release/, writes and verifies SHA256SUMS.txt, writes notes.md (CHANGELOG section +
          # the Installation section of docs/INSTALL.md) and only then runs gh with the assets.
          python scripts/verify-release-assets.py publish \
            --version "$VERSION" \
            --platforms-file release-platforms.json \
            --artifacts artifacts \
            --out release \
            --changelog CHANGELOG.md \
            --install docs/INSTALL.md \
            --notes-out notes.md \
            -- gh release create "$TAG" --draft "${channel[@]}" --title "LingoPop $VERSION" --notes-file notes.md
      - name: Check the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir uploaded
          gh release download "$TAG" --dir uploaded
          if ! diff <(find release -mindepth 1 -printf '%P\n' | LC_ALL=C sort) \
            <(find uploaded -mindepth 1 -printf '%P\n' | LC_ALL=C sort); then
            echo "::error::the draft release does not carry exactly the verified assets"
            exit 1
          fi
          for file in release/*; do
            name=$(basename "$file")
            cmp -s "$file" "uploaded/$name" || { echo "::error::$name differs from the verified file"; exit 1; }
          done
          (cd uploaded && sha256sum --strict -c SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
