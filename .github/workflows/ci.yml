name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the full build runs: a change set made only of Markdown files
  # (except docs/INSTALL.md, see scripts/ci-changes.py) skips the code matrices.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull request is checked out as its merge commit: parent 1 is the base.
          if [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          else
            base="$BEFORE"
          fi
          # A new branch, a force push or an unknown base: build everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base unknown, full build"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a rename (a renamed docs/INSTALL.md still builds);
          # core.quotePath=false prints non-ASCII paths as they are, not quoted and escaped.
          files=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD)
          printf 'changed files:\n%s\n' "$files"
          printf '%s\n' "$files" | python3 scripts/ci-changes.py | tee -a "$GITHUB_OUTPUT"

  frontend:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix app
      - name: Build frontend
        shell: bash
        run: npm run build --prefix app
      - name: Test frontend
        shell: bash
        run: npm test --prefix app
      - name: Check frontend
        shell: bash
        run: npm run check --prefix app

  general:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check localization catalogs
        shell: bash
        run: |
          python scripts/gen-localizations.py check
          python -m unittest discover -s scripts/tests -p 'test_localizations.py'
      - name: Check versions and release scripts
        shell: bash
        run: |
          python scripts/check-version.py
          python -m unittest discover -s scripts/tests -p 'test_check_version.py'
          python -m unittest discover -s scripts/tests -p 'test_release_assets.py'
          python -m unittest discover -s scripts/tests -p 'test_package_macos_mode.py'
          python -m unittest discover -s scripts/tests -p 'test_ci_changes.py'
          python -m unittest discover -s scripts/tests -p 'test_ci_results.py'
      - name: Check macOS production readiness
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The macOS leg only; a missing shellcheck is installed, never skipped silently.
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck scripts/*.sh
          bash scripts/check-macos-production.sh
          python -m unittest discover -s scripts/tests -p 'test_macos_production_gate.py'

  core:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The Tauri crate embeds app/dist at compile time (tauri-codegen needs it before cargo).
      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix app
      - name: Build frontend
        shell: bash
        run: npm run build --prefix app
      - name: Check formatting
        shell: bash
        run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --workspace --locked
      - name: Check core dependencies
        shell: bash
        run: bash scripts/check-core-deps.sh
      - name: Windows desktop tests (diagnostic probe and desktop smoke)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test -p lingopop-platform --locked --test desktop_probe --test windows_smoke --test foreground_helper -- --ignored --nocapture --test-threads=1

      - name: Windows input-driven desktop tests
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: cargo test -p lingopop-platform --locked --test windows_desktop_input -- --ignored --nocapture --test-threads=1

  build-and-test:
    name: build-and-test
    needs: [changes, frontend, general, core]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every needed job to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FRONTEND: ${{ needs.frontend.result }}
          GENERAL: ${{ needs.general.result }}
          CORE: ${{ needs.core.result }}
        run: bash scripts/check-ci-results.sh
