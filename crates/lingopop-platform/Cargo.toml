[package]
name = "lingopop-platform"
description = "OS integration traits and implementations for LingoPop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
dev-plaintext = []

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
zeroize = "=1.9.1"
getrandom = "=0.4.3"
crossbeam-channel = "0.5.17"
keyboard-types = "0.8.3"
lingopop-core = { path = "../lingopop-core" }
png = "0.18.1"
thiserror = "2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.9.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"
core-graphics = "0.25.0"
# `ForeignType::as_ptr` of core-graphics' `CGImage` (already in the lock through core-graphics).
foreign-types = "=0.5.0"
block2 = "0.6.2"
# proc_pidinfo / proc_bsdinfo for the kernel process start time (macos/procinfo.rs). No std
# needed; objc2-app-kit already pulls libc in.
libc = { version = "0.2.191", default-features = false }
objc2 = "0.6.5"
# The popup panel is derived from the Tauri window's AppKit handle (`configure_popup_panel`);
# the same version Tauri already locks.
raw-window-handle = "=0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSEvent",
    "NSPanel",
    "NSScreen",
    "NSView",
    "NSWindow",
    "block2",
    "NSGraphics",
    "objc2-core-foundation",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
    # The region overlay window (macos/overlay_window.rs): dim fill, hole, border, size label.
    "NSAttributedString",
    "NSBezierPath",
    "NSColor",
    "NSCursor",
    "NSFont",
    "NSFontDescriptor",
    "NSShadow",
    "NSStringDrawing",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSLocale",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSValue",
    "block2",
    "NSArray",
    "NSData",
    "NSDate",
    "NSEnumerator",
    "NSObject",
    "NSString",
] }

# Vision text recognition (macos/ocr.rs). Exact pin, verified in the registry: bindings for
# VNRecognizeTextRequest / VNImageRequestHandler / VNRecognizedTextObservation, macOS 10.15+
# (the app floor is 13). Only the needed headers are enabled.
objc2-vision = { version = "=0.3.2", default-features = false, features = [
    "std",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }

[dev-dependencies]
tempfile = "3"

# Spawned by the desktop smoke tests as an external process (see the file header).
[[test]]
name = "foreground_helper"
harness = false

# Owner-run real-AppKit popup check: runs on the main thread, skips unless `--ignored`.
[[test]]
name = "macos_popup"
harness = false

# Owner-run real-screen capture check: needs the main thread (monitor topology) and the
# explicit opt-in below, skips unless `--ignored`.
[[test]]
name = "macos_screen"
harness = false

# Owner-run real-AppKit region overlay check: needs the main thread and real input, skips
# unless `--ignored`.
[[test]]
name = "macos_overlay"
harness = false

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Media_Ocr",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
