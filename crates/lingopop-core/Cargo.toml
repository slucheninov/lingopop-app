[package]
name = "lingopop-core"
description = "OS-agnostic core of LingoPop (models, providers, storage)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
url = "2.5.8"
uuid = { version = "1", features = ["serde", "v4"] }
whatlang = "0.18.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = "0.6.5"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["system-proxy"] }
