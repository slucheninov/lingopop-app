[package]
name = "lingopop-app"
description = "LingoPop tray app (thin Tauri shell over lingopop-orchestrator)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.90"

[lib]
name = "lingopop_app"

[[bin]]
name = "lingopop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
lingopop-core = { path = "../../crates/lingopop-core" }
lingopop-orchestrator = { path = "../../crates/lingopop-orchestrator" }
lingopop-platform = { path = "../../crates/lingopop-platform" }
async-trait = "0.1.92"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
