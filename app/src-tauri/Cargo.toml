[package]
name = "lingopop-app"
description = "LingoPop tray app (thin Tauri shell over lingopop-orchestrator)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.90"

[lib]
name = "lingopop_app"

[[bin]]
name = "lingopop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
crossbeam-channel = "0.5.17"
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
thiserror = "2"
lingopop-core = { path = "../../crates/lingopop-core" }
lingopop-orchestrator = { path = "../../crates/lingopop-orchestrator" }
lingopop-platform = { path = "../../crates/lingopop-platform" }
tokio = { version = "1", features = ["sync", "time"] }
uuid = "1"
async-trait = "0.1.92"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[features]
# Embed app/dist via the tauri:// custom protocol instead of loading devUrl.
# `tauri build` enables this itself; plain cargo release builds must pass it.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# The version Tauri 2.12.5 locks; tests parse the tray accelerator strings with it.
muda = { version = "=0.20.0", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
